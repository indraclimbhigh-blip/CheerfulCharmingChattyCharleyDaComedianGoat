<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title># CheerfulCharmingChattyCharleyDaComedianGoat</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero-card">
        <div class="hero-badge">CIRCUS CHAT</div>
        <h1># CheerfulCharmingChattyCharleyDaComedianGoat</h1>
        <p>Ask anything and watch the goofy clown crew plan a silly answer before it pops out in bright red and yellow style!</p>
      </header>

      <main class="chat-card">
        <section id="chatWindow" class="chat-window" aria-live="polite"></section>

        <div class="input-panel">
          <label for="userInput" class="sr-only">Type your question</label>
          <textarea id="userInput" placeholder="Say something silly, smart, or spectacular..." rows="2"></textarea>
          <button id="sendBtn" class="send-button">Send to the Clown</button>
        </div>
      </main>

      <footer class="footer-card">
        <p>Powered by circus energy, clown flair, and a classroom proxy.</p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
