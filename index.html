<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Charley the Chatty Comedian Goat</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero-card">
        <div class="hero-badge">LIVE CHAT</div>
        <h1>Charley the Chatty Comedian Goat</h1>
        <p>Ask anything and watch Charley think it through with a secret LLM chef before delivering the punchline!</p>
      </header>

      <main class="chat-card">
        <section id="chatWindow" class="chat-window" aria-live="polite"></section>

        <div class="input-panel">
          <label for="userInput" class="sr-only">Type your question</label>
          <textarea id="userInput" placeholder="Say something silly, smart, or spectacular..." rows="2"></textarea>
          <button id="sendBtn" class="send-button">Send to Charley</button>
        </div>
      </main>

      <footer class="footer-card">
        <p>Powered by a vibrant classroom proxy and a goat-sized sense of humor.</p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
